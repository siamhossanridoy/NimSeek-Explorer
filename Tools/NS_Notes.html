<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NimSeek Notes</title>
    <link rel="stylesheet" href="../assets/NS_Notes.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated Glass Background -->
    <div class="glass-bg">
        <div class="glass-orb orb1"></div>
        <div class="glass-orb orb2"></div>
        <div class="glass-orb orb3"></div>
        <div class="glass-orb orb4"></div>
        <div class="glass-overlay"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Minimal Header with View Toggle -->
        <div class="header glass">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">📝</span>
                    <span class="logo-text">NimSeek Notes</span>
                </div>
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search notes..." class="search-input">
                </div>
                <div class="header-actions">
                    <!-- View Toggle Buttons -->
                    <div class="view-toggle">
                        <button id="gridViewBtn" class="view-btn glass-icon" title="Grid view">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path fill="currentColor" d="M3 3h7v7H3zm11 0h7v7h-7zm0 11h7v7h-7zM3 14h7v7H3z"/>
                            </svg>
                        </button>
                        <button id="listViewBtn" class="view-btn glass-icon" title="List view">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path fill="currentColor" d="M3 4h18v2H3zm0 7h18v2H3zm0 7h18v2H3z"/>
                            </svg>
                        </button>
                    </div>
                    
                    <button id="importBtn" class="icon-btn glass-icon" title="Import notes">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                        </svg>
                    </button>
                    <button id="exportBtn" class="icon-btn glass-icon" title="Export notes">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path fill="currentColor" d="M19 13v5c0 .55-.45 1-1 1H6c-.55 0-1-.45-1-1v-5c0-.55-.45-1-1-1s-1 .45-1 1v6c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-6c0-.55-.45-1-1-1s-1 .45-1 1zm-6-.33l1.88-1.88c.39-.39 1.02-.39 1.41 0 .39.39.39 1.02 0 1.41l-3.59 3.59c-.39.39-1.02.39-1.41 0l-3.59-3.59c-.39-.39-.39-1.02 0-1.41.39-.39 1.02-.39 1.41 0L11 12.67V3c0-.55.45-1 1-1s1 .45 1 1v9.67z"/>
                        </svg>
                    </button>
                    <button id="createNoteBtn" class="create-btn glass">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                        </svg>
                        <span>New note</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Quick Stats (Minimal) -->
        <div class="stats-row">
            <span id="totalNotes">0</span> notes · 
            <span id="storageUsed">0 KB</span>
        </div>

        <!-- Pinned Notes Section -->
        <div id="pinnedSection" class="notes-section" style="display: none;">
            <div class="section-header">
                <span class="section-icon">📌</span>
                <span class="section-title">Pinned</span>
                <span id="pinnedCount" class="section-count"></span>
            </div>
            <div id="pinnedContainer" class="notes-grid"></div>
        </div>

        <!-- Other Notes Section -->
        <div id="otherSection" class="notes-section">
            <div class="section-header">
                <span class="section-icon">📄</span>
                <span class="section-title">Others</span>
                <span id="otherCount" class="section-count"></span>
            </div>
            <div id="otherContainer" class="notes-grid"></div>
        </div>
    </div>

    <!-- Create Note Modal (with Complete Toolbar) -->
    <div id="createModal" class="modal">
        <div class="modal-content glass">
            <div class="modal-actions">
                <button class="modal-close" id="closeCreateModal">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
            
            <input type="text" id="createTitleInput" placeholder="Title" class="modal-title" autocomplete="off">
            <div id="createContentInput" class="modal-content-field rich-editor" contenteditable="true" placeholder="Take a note..."></div>
            
            <!-- Complete Formatting Toolbar at Bottom -->
            <div class="format-toolbar bottom-toolbar">
                <!-- Undo/Redo -->
                <button class="format-btn" id="createUndoBtn" title="Undo (Ctrl+Z)">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
                    </svg>
                </button>
                <button class="format-btn" id="createRedoBtn" title="Redo (Ctrl+Y)">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.06-5.5 7.6-5.5 1.96 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/>
                    </svg>
                </button>
                <span class="toolbar-divider"></span>
                
                <!-- Headings -->
                <button class="format-btn" data-format="h1" title="Heading 1 (Ctrl+1)">
                    <span class="format-h1">H1</span>
                </button>
                <button class="format-btn" data-format="h2" title="Heading 2 (Ctrl+2)">
                    <span class="format-h2">H2</span>
                </button>
                <button class="format-btn" data-format="p" title="Normal (Ctrl+0)">
                    <span class="format-p">P</span>
                </button>
                <span class="toolbar-divider"></span>
                
                <!-- Text Formatting -->
                <button class="format-btn" data-format="bold" title="Bold (Ctrl+B)">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M15.6 10.79c.97-.67 1.65-1.77 1.65-2.79 0-2.26-1.75-4-4-4H7v14h7.04c2.09 0 3.71-1.7 3.71-3.79 0-1.52-.86-2.82-2.15-3.42zM10 6.5h3c1.11 0 2 .89 2 2s-.89 2-2 2h-3v-4zm3.5 9H10v-4h3.5c1.11 0 2 .89 2 2s-.89 2-2 2z"/>
                    </svg>
                </button>
                <button class="format-btn" data-format="italic" title="Italic (Ctrl+I)">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M10 4v3h2.21l-3.42 8H6v3h8v-3h-2.21l3.42-8H18V4z"/>
                    </svg>
                </button>
                <button class="format-btn" data-format="underline" title="Underline (Ctrl+U)">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M12 17c3.31 0 6-2.69 6-6V3h-2.5v8c0 1.93-1.57 3.5-3.5 3.5S8.5 12.93 8.5 11V3H6v8c0 3.31 2.69 6 6 6zm-7 2v2h14v-2H5z"/>
                    </svg>
                </button>
                <span class="toolbar-divider"></span>
                
                <!-- Lists -->
                <button class="format-btn" data-format="bullet" title="Bullet list">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/>
                    </svg>
                </button>
                <button class="format-btn" data-format="number" title="Numbered list">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/>
                    </svg>
                </button>
                <button class="format-btn" data-format="letter" title="Letter list">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M4 6v2h16V6H4zm0 12h16v-2H4v2zm0-5h16v-2H4v2zM2 6h1v2H2V6zm0 5h1v2H2v-2zm0 5h1v2H2v-2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Edit Note Modal (with Complete Toolbar) -->
    <div id="editModal" class="modal">
        <div class="modal-content glass">
            <div class="modal-actions">
                <button class="modal-action" id="pinNoteBtn" title="Pin note">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M16 12V4h1V2H7v2h1v8l-2 2v2h5v6h2v-6h5v-2l-2-2z"/>
                    </svg>
                </button>
                <button class="modal-action" id="downloadNoteBtn" title="Download note">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                    </svg>
                </button>
                <button class="modal-action" id="deleteNoteBtn" title="Delete note">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                    </svg>
                </button>
                <button class="modal-close" id="closeEditModal">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
            
            <input type="text" id="editTitleInput" placeholder="Title" class="modal-title" autocomplete="off">
            <div id="editContentInput" class="modal-content-field rich-editor" contenteditable="true" placeholder="Edit note..."></div>
            <div class="auto-save-indicator" id="autoSaveIndicator">Saved</div>
            
            <!-- Complete Formatting Toolbar at Bottom -->
            <div class="format-toolbar bottom-toolbar">
                <!-- Undo/Redo -->
                <button class="format-btn" id="editUndoBtn" title="Undo (Ctrl+Z)">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
                    </svg>
                </button>
                <button class="format-btn" id="editRedoBtn" title="Redo (Ctrl+Y)">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.06-5.5 7.6-5.5 1.96 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/>
                    </svg>
                </button>
                <span class="toolbar-divider"></span>
                
                <!-- Headings -->
                <button class="format-btn" data-format="h1" title="Heading 1 (Ctrl+1)">
                    <span class="format-h1">H1</span>
                </button>
                <button class="format-btn" data-format="h2" title="Heading 2 (Ctrl+2)">
                    <span class="format-h2">H2</span>
                </button>
                <button class="format-btn" data-format="p" title="Normal (Ctrl+0)">
                    <span class="format-p">P</span>
                </button>
                <span class="toolbar-divider"></span>
                
                <!-- Text Formatting -->
                <button class="format-btn" data-format="bold" title="Bold (Ctrl+B)">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M15.6 10.79c.97-.67 1.65-1.77 1.65-2.79 0-2.26-1.75-4-4-4H7v14h7.04c2.09 0 3.71-1.7 3.71-3.79 0-1.52-.86-2.82-2.15-3.42zM10 6.5h3c1.11 0 2 .89 2 2s-.89 2-2 2h-3v-4zm3.5 9H10v-4h3.5c1.11 0 2 .89 2 2s-.89 2-2 2z"/>
                    </svg>
                </button>
                <button class="format-btn" data-format="italic" title="Italic (Ctrl+I)">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M10 4v3h2.21l-3.42 8H6v3h8v-3h-2.21l3.42-8H18V4z"/>
                    </svg>
                </button>
                <button class="format-btn" data-format="underline" title="Underline (Ctrl+U)">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M12 17c3.31 0 6-2.69 6-6V3h-2.5v8c0 1.93-1.57 3.5-3.5 3.5S8.5 12.93 8.5 11V3H6v8c0 3.31 2.69 6 6 6zm-7 2v2h14v-2H5z"/>
                    </svg>
                </button>
                <span class="toolbar-divider"></span>
                
                <!-- Lists -->
                <button class="format-btn" data-format="bullet" title="Bullet list">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/>
                    </svg>
                </button>
                <button class="format-btn" data-format="number" title="Numbered list">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/>
                    </svg>
                </button>
                <button class="format-btn" data-format="letter" title="Letter list">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M4 6v2h16V6H4zm0 12h16v-2H4v2zm0-5h16v-2H4v2zM2 6h1v2H2V6zm0 5h1v2H2v-2zm0 5h1v2H2v-2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Color Picker Popup Modal -->
    <div id="colorPickerModal" class="modal color-picker-modal">
        <div class="modal-content glass color-picker-popup">
            <div class="color-picker-header">
                <span>Choose color</span>
                <button class="color-picker-close" id="closeColorPicker">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
            <div class="color-picker-grid">
                <button class="color-option default" data-color="default" title="Default"></button>
                <button class="color-option red" data-color="red" title="Red"></button>
                <button class="color-option orange" data-color="orange" title="Orange"></button>
                <button class="color-option yellow" data-color="yellow" title="Yellow"></button>
                <button class="color-option green" data-color="green" title="Green"></button>
                <button class="color-option teal" data-color="teal" title="Teal"></button>
                <button class="color-option blue" data-color="blue" title="Blue"></button>
                <button class="color-option purple" data-color="purple" title="Purple"></button>
                <button class="color-option pink" data-color="pink" title="Pink"></button>
                <button class="color-option brown" data-color="brown" title="Brown"></button>
                <button class="color-option gray" data-color="gray" title="Gray"></button>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div id="importModal" class="modal">
        <div class="modal-content glass modal-small">
            <div class="modal-actions">
                <button class="modal-close" id="closeImportModal">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
            <h3 class="modal-small-title">Import Notes</h3>
            <input type="file" id="importFile" accept=".json" class="file-input">
            <div id="importPreview" class="import-preview"></div>
            <button id="confirmImportBtn" class="modal-btn glass" disabled>Import</button>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content glass modal-small">
            <div class="modal-actions">
                <button class="modal-close" id="closeConfirmModal">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
            <h3 class="modal-small-title" id="confirmTitle">Delete Note?</h3>
            <p id="confirmMessage" class="confirm-message">This action cannot be undone.</p>
            <div class="confirm-actions">
                <button id="confirmNoBtn" class="modal-btn glass">Cancel</button>
                <button id="confirmYesBtn" class="modal-btn glass delete-btn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Note saved</div>

    <script src="../assets/utils.js"></script>
    <script src="../assets/ns_notes.js"></script>
</body>
</html>
